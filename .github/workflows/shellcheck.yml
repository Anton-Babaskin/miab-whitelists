name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n add_whitelists.sh
          bash -n refresh_cloud_senders.sh
          bash -n tests/run_tests.sh

      - name: ShellCheck
        run: |
          shellcheck add_whitelists.sh
          shellcheck refresh_cloud_senders.sh
          shellcheck tests/run_tests.sh

  test:
    name: Functional tests (sandboxed)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test suite
        run: sudo env "PATH=$PATH" bash tests/run_tests.sh
